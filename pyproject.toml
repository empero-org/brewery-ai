[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "homebrew-ai"
dynamic = ["version"]
description = "Homebrew by Empero: a guided agent that helps anyone fine-tune ('brew') their own language model."
readme = "README.md"
license = "LicenseRef-Homebrew"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Empero", email = "hello@empero.org" }]
keywords = ["llm", "fine-tuning", "lora", "agent", "qwen", "llama", "gemma", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Control-plane dependencies only: the agent runs on a laptop without a GPU.
# Training dependencies live in the `train` extra and are installed on the
# machine that actually trains (local GPU box or a rented server).
dependencies = [
    "rich>=13.7",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "huggingface_hub>=0.30",
    "datasets>=3.0",
    "transformers>=4.56",
    "jinja2>=3.1",
    "psutil>=5.9",
    "anthropic>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.56",
    "peft>=0.17",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
dev = [
    "pytest>=8.0",
    "peft>=0.17",
    "accelerate>=1.0",
]

[project.urls]
Homepage = "https://empero.org"
Source = "https://github.com/empero-org/homebrew-ai"
"Hugging Face" = "https://huggingface.co/empero-ai"

[project.scripts]
homebrew = "homebrew_ai.cli:main"
homebrew-ai = "homebrew_ai.cli:main"

[tool.hatch.version]
path = "src/homebrew_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "network: needs internet access (Hugging Face Hub)",
    "slow: trains a tiny model on CPU",
]
