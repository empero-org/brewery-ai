family: gemma3
display_name: Gemma 3
vendor: Google
modality: text
summary: >-
  Google's Gemma 3 (March 2025), from a tiny 270M model up to 27B. 4B and larger
  can also see images; Homebrew fine-tunes the language part and leaves vision
  untouched. Repos are gated: accept Google's terms on Hugging Face first.
license:
  id: gemma
  name: Gemma Terms of Use
  url: https://ai.google.dev/gemma/terms
  hub_id: gemma
  notice: "Gemma is provided under and subject to the Gemma Terms of Use found at ai.google.dev/gemma/terms"
requirements:
  transformers: ">=5.6"
loading:
  auto_class: causal_lm
  attn_implementation: sdpa
  bf16_required: true
chat_format:
  assistant_header: "<start_of_turn>model\n"
  turn_end: ["<end_of_turn>"]
  reasoning: inline
  tools: inline
  strict_alternation: true
  document_end: "<eos>"
  document_bos: true
stop_tokens: ["<end_of_turn>", "<eos>"]
lora_targets:
  default: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  attention: [q_proj, k_proj, v_proj, o_proj]
  mlp: [gate_proj, up_proj, down_proj]
sampling:
  default: {temperature: 1.0, top_p: 0.95, top_k: 64}
notes:
  - "Needs a GPU with bf16 (RTX 30xx/40xx/50xx, A100, H100, L4, ...). On T4/V100 Gemma's activations overflow fp16."
  - "Gemma 3 has no native tool-calling or thinking format; Homebrew teaches tool calls as <tool_call> JSON blocks and reasoning as inline <think> blocks."
  - "There is no system role: the system prompt is merged into the first user turn by the chat template."
  - "Terms of Use: derivatives must pass on Google's use restrictions and include a NOTICE file. Homebrew's packager writes both."
  - "Gemma's 262k vocabulary makes the logits large; keep sequence length and batch moderate on small GPUs."
variants:
  - {id: google/gemma-3-270m-it, label: Gemma 3 270M, params_b: 0.268, layers: 18, hidden: 640, intermediate: 2048, heads: 4, kv_heads: 1, head_dim: 256, vocab: 262144, context: 32768, tied_embeddings: true, gated: true, recommended: true,
     guidelines: {full: {learning_rate: {default: 5.0e-5, recommended: [1.0e-5, 1.0e-4]}}}, notes: ["Google's tiny model for task-specific fine-tunes; full fine-tuning fits almost anywhere."]}
  - {id: google/gemma-3-1b-it, label: Gemma 3 1B, params_b: 1.0, layers: 26, hidden: 1152, intermediate: 6912, heads: 4, kv_heads: 1, head_dim: 256, vocab: 262144, context: 32768, tied_embeddings: true, gated: true}
  - {id: google/gemma-3-4b-it, label: Gemma 3 4B, params_b: 4.30, layers: 34, hidden: 2560, intermediate: 10240, heads: 8, kv_heads: 4, head_dim: 256, vocab: 262208, context: 131072, tied_embeddings: true, gated: true, recommended: true}
  - {id: google/gemma-3-12b-it, label: Gemma 3 12B, params_b: 12.19, layers: 48, hidden: 3840, intermediate: 15360, heads: 16, kv_heads: 8, head_dim: 256, vocab: 262208, context: 131072, tied_embeddings: true, gated: true}
  - {id: google/gemma-3-27b-it, label: Gemma 3 27B, params_b: 27.43, layers: 62, hidden: 5376, intermediate: 21504, heads: 32, kv_heads: 16, head_dim: 128, vocab: 262208, context: 131072, tied_embeddings: true, gated: true,
     guidelines: {full: {allowed: false, notes: ["Full fine-tuning a 27B model needs a multi-GPU cluster; use LoRA or QLoRA."]}}}
  - {id: google/gemma-3-270m, label: Gemma 3 270M (pt), kind: base, params_b: 0.268, layers: 18, hidden: 640, intermediate: 2048, heads: 4, kv_heads: 1, head_dim: 256, vocab: 262144, context: 32768, tied_embeddings: true, gated: true, chat_template_from: google/gemma-3-270m-it}
  - {id: google/gemma-3-1b-pt, label: Gemma 3 1B (pt), kind: base, params_b: 1.0, layers: 26, hidden: 1152, intermediate: 6912, heads: 4, kv_heads: 1, head_dim: 256, vocab: 262144, context: 32768, tied_embeddings: true, gated: true, chat_template_from: google/gemma-3-1b-it}
  - {id: google/gemma-3-4b-pt, label: Gemma 3 4B (pt), kind: base, params_b: 4.30, layers: 34, hidden: 2560, intermediate: 10240, heads: 8, kv_heads: 4, head_dim: 256, vocab: 262208, context: 131072, tied_embeddings: true, gated: true, chat_template_from: google/gemma-3-4b-it}
  - {id: google/gemma-3-12b-pt, label: Gemma 3 12B (pt), kind: base, params_b: 12.19, layers: 48, hidden: 3840, intermediate: 15360, heads: 16, kv_heads: 8, head_dim: 256, vocab: 262208, context: 131072, tied_embeddings: true, gated: true, chat_template_from: google/gemma-3-12b-it}
