family: qwen_image
display_name: Qwen-Image
vendor: Alibaba Qwen
modality: image
summary: >-
  Qwen-Image 2.1 (September 2026): a 7B single-stream diffusion transformer with a
  Qwen3-VL-8B text encoder. Excellent at rendering text inside images, outputs RGBA.
  Homebrew trains LoRA adapters that teach it a style, a character or an object.
license:
  id: qwen-research
  name: Qwen Research License (non-commercial)
  url: https://huggingface.co/Qwen/Qwen-Image-2.1/blob/main/LICENSE
  hub_id: other
  attribution: Built with Qwen
  notice: "Built with Qwen. Qwen-Image 2.1 is licensed under the Qwen Research License Agreement; this adapter and its outputs may only be used for non-commercial research or evaluation."
  copy_files: [LICENSE]
  noncommercial: true
  name_rules: "Do not use 'Qwen' as the primary name of your LoRA (e.g. call it 'pirate-sketch-lora', and mention 'Built with Qwen' in the card)."
requirements:
  transformers: ">=5.17"
  packages:
    - "diffusers @ https://github.com/huggingface/diffusers/archive/8b33bfc04b6b5e8bb58a58e55f68746c1bbee4cd.zip"
    - "pillow>=10"
    - "bitsandbytes>=0.46.1"
loading:
  bf16_required: true
pipeline:
  kind: qwen_image_21
  pipeline_class: QwenImage21Pipeline
  vae_class: AutoencoderKLQwenImage21
  inference_steps: 40
lora_targets:
  default: [to_q, to_k, to_v, to_out.0]
  full_block: [to_q, to_k, to_v, to_out.0, img_mlp.gate_layer, img_mlp.proj, img_mlp.out]
guidelines:
  lora:
    learning_rate: {min: 1.0e-6, max: 3.0e-4, default: 1.0e-4, recommended: [5.0e-5, 1.5e-4]}
    max_steps: {min: 50, max: 10000, default: 1000, recommended: [300, 2500]}
    resolution: {choices: [512, 768, 1024], default: 1024}
  qlora:
    learning_rate: {min: 1.0e-6, max: 3.0e-4, default: 1.0e-4, recommended: [5.0e-5, 1.5e-4]}
    max_steps: {min: 50, max: 10000, default: 1000, recommended: [300, 2500]}
    resolution: {choices: [512, 768, 1024], default: 1024}
notes:
  - "LICENSE: Qwen-Image 2.1 is NON-COMMERCIAL (Qwen Research License). LoRAs trained on it, and images made with them, may not be sold or used commercially. Published LoRAs must show 'Built with Qwen' and include the license."
  - "Use 10-50 good, varied images. Give every image a caption that describes it, plus one unique trigger word (e.g. 'sks corgi')."
  - "Less is more: outputs start to drift after ~1000 steps at lr 1e-4, and lr 3e-4 visibly damages unrelated prompts. Check samples every ~250 steps."
  - "Needs an NVIDIA GPU with bf16 and 24 GB+. On 24 GB cards use QLoRA (4-bit transformer) or train at 512px."
  - "Never train on photos of real people without their permission, and never on anyone under 18."
variants:
  - id: Qwen/Qwen-Image-2.1
    label: Qwen-Image 2.1
    kind: image
    params_b: 7.115
    text_encoder_params_b: 8.77
    vae_params_b: 0.338
    layers: 32
    hidden: 4096
    recommended: true
